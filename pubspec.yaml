name: fixnow
description: FixNow home appliance service management platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.0
  firebase_auth: ^5.6.1
  cloud_firestore: ^5.6.10
  firebase_storage: ^12.4.8
  firebase_messaging: ^15.2.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.3
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
