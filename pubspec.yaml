name: fixnow
description: FixNow home appliance repair, service booking, technician tracking, and field operations platform.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.0
  firebase_auth: ^5.6.1
  cloud_firestore: ^5.6.10
  firebase_storage: ^12.4.8
  flutter_riverpod: ^2.6.1
  flutter_map: ^7.0.2
  go_router: ^15.1.3
  geolocator: ^14.0.1
  http: ^1.2.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  flutter_local_notifications: ^22.0.1
  firebase_messaging: ^15.2.10
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700


