services:
  - type: web
    name: fixnow-tracking-server
    runtime: docker
    plan: free
    dockerContext: ./tracking-server
    dockerfilePath: ./tracking-server/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
